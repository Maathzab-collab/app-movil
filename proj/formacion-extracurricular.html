<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5271ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Formación extracurricular</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/formacion-extracurricular.css">
</head>

<body>
  <main class="screen" data-page="formacion-extracurricular">

    <header class="hero">
      <div class="hero-top">
        <button class="icon-btn" id="back" type="button" aria-label="Volver">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <span class="step-label"></span>


        <button class="icon-btn" id="logout" type="button" aria-label="Cerrar sesión">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>

      <h1>Formación extracurricular</h1>
      <p>Cursos, congresos y certificados</p>
      <div class="steps" aria-hidden="true"></div>
    </header>

    <section class="scroll page-anim">
      <div class="card">

        <div class="field">
          <label for="cursos">Cursos:</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <input id="cursos" data-field="cursos" type="text" placeholder="Nombre del curso" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="congresos">Congresos:</label>
          <div class="input-wrap">

            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
            <input id="congresos" data-field="congresos" type="text" placeholder="Nombre del congreso" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="conferencias">Conferencias:</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/>
            </svg>
            <input id="conferencias" data-field="conferencias" type="text" placeholder="Nombre de la conferencia" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="certificado">Certificado:</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="7"/>
              <path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"/>
            </svg>
            <input id="certificado" data-field="certificado" type="text" placeholder="Nombre del certificado" autocomplete="off">
          </div>
        </div>

      </div>
    </section>

    <footer class="actionbar">
      <button class="btn ghost" id="prev" type="button">Atrás</button>
      <button class="btn primary" type="button" data-next>Continuar</button>
    </footer>

  </main>

  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
