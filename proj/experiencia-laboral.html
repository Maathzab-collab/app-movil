<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5271ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Experiencia laboral</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/experiencia-laboral.css">
</head>

<body>
  <main class="screen" data-page="experiencia-laboral">

    <header class="hero">
      <div class="hero-top">
        <button class="icon-btn" id="back" type="button" aria-label="Volver">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <span class="step-label"></span>

        <button class="icon-btn" id="logout" type="button" aria-label="Cerrar sesión">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>

      <h1>Experiencia laboral</h1>
      <p>Tu trayectoria profesional</p>
      <div class="steps" aria-hidden="true"></div>
    </header>

    <section class="scroll page-anim">
      <div class="card">

        <div class="field">
          <label for="empresa">Empresa:</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>
            </svg>
            <input id="empresa" data-field="empresa" type="text" placeholder="Nombre de la empresa" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="periodo">Periodo de trabajo:</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            <input id="periodo" data-field="periodo" type="text" placeholder="Ej. 2022 - 2024" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="puesto">Puesto de trabajo:</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            <input id="puesto" data-field="puesto" type="text" placeholder="Tu puesto" autocomplete="off">
          </div>
        </div>

      </div>
    </section>

    <footer class="actionbar">
      <button class="btn ghost" id="prev" type="button">Atrás</button>
      <button class="btn primary" type="button" data-next>Continuar</button>
    </footer>

  </main>

  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
