<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5271ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Iniciar sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/index.css">
</head>

<body>
  <main class="screen login" data-page="index">
    <div class="login-body page-anim">

      <header class="login-top">
        <div class="login-logo">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h1>Bienvenido</h1>

        <p>Inicia sesión para continuar</p>
      </header>

      <section class="login-panel">
        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <div class="input-wrap">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
                <path d="M22 6l-10 7L2 6"/>
              </svg>
              <input id="email" type="email" placeholder="tucorreo@gmail.com" autocomplete="email" inputmode="email">
            </div>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input id="password" type="password" placeholder="Tu contraseña" autocomplete="current-password">
              <button class="eye" type="button" aria-label="Mostrar u ocultar contraseña">
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <button type="button" class="link-small" id="forgot">¿Olvidaste tu contraseña?</button>
          <button class="btn primary" type="submit">Iniciar sesión</button>

        </form>

        <div class="divider">o</div>

        <a class="btn outline" href="registro.html">Registrarse</a>
        <button class="btn text" type="button" id="guest">Continuar como invitado</button>
      </section>

    </div>
  </main>

  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/pages/index.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
