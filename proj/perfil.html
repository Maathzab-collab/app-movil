<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5271ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mi perfil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/perfil.css">
</head>

<body>
  <main class="screen" data-page="perfil">

    <header class="hero tall">
      <div class="hero-top">
        <button class="icon-btn" id="back" type="button" aria-label="Volver">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <span class="step-label"></span>

        <button class="icon-btn" id="logout" type="button" aria-label="Cerrar sesión">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>

      <h1>Mi perfil</h1>
      <p>Cuéntanos quién eres</p>
      <div class="steps" aria-hidden="true"></div>
    </header>

    <section class="scroll avatar-first page-anim">

      <button class="avatar" id="avatar" type="button" aria-label="Cambiar foto de perfil">
        <span class="face">
          <svg id="avatarSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <img id="avatarImg" alt="Foto de perfil" hidden>
        </span>
        <span class="badge">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </span>
      </button>
      <input type="file" id="avatarInput" accept="image/*" hidden>

      <div class="card">

        <div class="field">
          <label for="nombre">Nombre</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="nombre" data-field="nombre" type="text" placeholder="Tu nombre completo" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <span class="label">Acta de nacimiento</span>
          <div class="upload" data-file="acta">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M17 8l-5-5-5 5"/>
              <path d="M12 3v12"/>
            </svg>
            <span class="file-name">Subir archivo</span>
            <input type="file" hidden>
          </div>
        </div>

        <div class="field">
          <span class="label">INE</span>
          <div class="upload" data-file="ine">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M17 8l-5-5-5 5"/>
              <path d="M12 3v12"/>
            </svg>
            <span class="file-name">Subir archivo</span>
            <input type="file" hidden>
          </div>
        </div>

        <div class="field">
          <label for="curp">CURP</label>
          <div class="input-wrap">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <circle cx="8" cy="12" r="2"/>
              <path d="M14 10h4M14 14h4"/>
            </svg>
            <input id="curp" data-field="curp" type="text" placeholder="18 caracteres" autocomplete="off" maxlength="18" autocapitalize="characters">
          </div>
        </div>

      </div>
    </section>

    <footer class="actionbar">
      <button class="btn ghost" id="verPortafolio" type="button">Mi portafolio</button>
      <button class="btn primary" type="button" data-next>Continuar</button>
    </footer>

  </main>

  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/pages/perfil.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
