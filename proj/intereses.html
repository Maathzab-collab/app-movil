<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5271ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Intereses</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/intereses.css">
</head>

<body>
  <main class="screen" data-page="intereses">

    <header class="hero">
      <div class="hero-top">
        <button class="icon-btn" id="back" type="button" aria-label="Volver">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <span class="step-label"></span>

        <button class="icon-btn" id="logout" type="button" aria-label="Cerrar sesión">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>

      <h1>Intereses</h1>
      <p>Personaliza tus preferencias</p>
      <div class="steps" aria-hidden="true"></div>
    </header>

    <section class="scroll page-anim">
      <div class="card">

        <div class="field">
          <label for="especialidad">¿Cuál es tu especialidad?</label>
          <div class="input-wrap textarea-wrap">
            <textarea id="especialidad" data-field="especialidad" placeholder="Cuéntanos en qué te quieres enfocar"></textarea>
          </div>
        </div>

        <div class="field">
          <label for="intereses">Etiquetas de preferencias:</label>
          <div class="chip-box" data-chips="intereses" data-suggest="Programación,Diseño,Redes,Inteligencia artificial,Ciberseguridad,Electrónica">
            <span class="chip-list"></span>
            <input id="intereses" type="text" placeholder="Escribe y presiona Enter" enterkeyhint="done" autocomplete="off">
          </div>
          <div class="suggest"></div>
        </div>

      </div>
    </section>

    <footer class="actionbar">
      <button class="btn ghost" id="prev" type="button">Atrás</button>
      <button class="btn primary" type="button" data-next>Continuar</button>
    </footer>

  </main>

  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
