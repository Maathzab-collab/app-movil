<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5271ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mi portafolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/portafolio.css">
</head>

<body>
  <main class="screen" data-page="portafolio">

    <header class="hero">
      <div class="hero-top">
        <button class="icon-btn" id="back" type="button" data-back="intereses.html" aria-label="Volver">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <span class="step-label">Resumen final</span>

        <button class="icon-btn" id="logout" type="button" aria-label="Cerrar sesión">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>

      <h1>Mi portafolio</h1>
      <p>Toda tu información lista para tu currículum</p>
    </header>

    <section class="scroll page-anim">

      <!-- Avance del portafolio (solo en pantalla) -->
      <div class="card progress no-print" id="progress"></div>

      <!-- Currículum: es lo único que se imprime / guarda en PDF -->
      <article class="cv" id="cv"></article>

      <!-- Documentos personales (solo en pantalla, no van en el CV) -->
      <div class="card docs no-print" id="docs"></div>
    </section>

    <footer class="actionbar no-print">
      <button class="btn ghost" id="editar" type="button">Editar</button>
      <button class="btn primary" id="pdf" type="button">Descargar PDF</button>
    </footer>

  </main>

  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/pages/portafolio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
